# Crispy Doom starter config (mobile-friendly defaults)
# This file can be safely overwritten by the port at runtime.

# --- video ---
fullscreen 1
vid_screenresolution 1280x720
vid_widescreen 1
vid_vsync 1
vid_fps 1
usegamma 0

# --- sound ---
snd_samplerate 44100
snd_sfxvolume 15
snd_musicvolume 12
snd_channels 32
snd_pitchshift 1
snd_flipleftright 0

# --- input ---
use_mouse 1
mouse_sensitivity_horiz 10
mouse_sensitivity_vert 10
mouse_acceleration 0
always_run 1
allow_jump 0
allow_freelook 0
invert_mouse 0

# --- gameplay niceties (crispy) ---
crispy_automapstats 1
crispy_brightmaps 1
crispy_coloredhud 1
crispy_crosshair 1
crispy_crosshairhealth 1
crispy_e1m8b_e2m8b 0
crispy_flipcorpses 1
crispy_freeaim 0
crispy_hires 1
crispy_jump 0
crispy_mouselook 0
crispy_pitch 0
crispy_translucency 1
crispy_uncapped 1          # uncapped rendering (still classic feel)
crispy_vanillapreset 0

# --- file paths ---
# Your app will copy assets to app_data_dir/crispy-doom
# Keep IWADs under:   <app_data_dir>/crispy-doom/iwads
# Example CLI (later): crispy-doom -iwad "<...>/iwads/freedoom2.wad"